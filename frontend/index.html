<!doctype html>
<html lang="en-ZA" data-theme="graphite" data-text-size="large">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fbfaf7" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#171613" />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <title>Farmyard Bookings</title>
    <script>
      // Apply the stored appearance (theme, light/dark, text size) before the
      // first paint so there is no flash. Mirrors src/lib/appearance.ts; the
      // server copy of the preference is synced once the session loads.
      (function () {
        try {
          var root = document.documentElement;
          var stored = null;
          try {
            stored = JSON.parse(localStorage.getItem("fy.appearance") || "null");
          } catch (e) {}
          if (!stored || typeof stored !== "object") {
            var legacy = localStorage.getItem("fy.theme");
            stored = { mode: legacy === "light" || legacy === "dark" ? legacy : "system" };
          }
          var themes = { graphite: 1, fynbos: 1, indigo: 1, lagoon: 1, cocoa: 1, contrast: 1 };
          var theme = themes[stored.theme] ? stored.theme : "graphite";
          var mode = stored.mode === "light" || stored.mode === "dark" ? stored.mode : "system";
          var size = stored.text_size === "default" || stored.text_size === "xlarge" ? stored.text_size : "large";
          var dark = mode === "dark" || (mode === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
          root.setAttribute("data-theme", theme);
          root.setAttribute("data-text-size", size);
          root.classList.toggle("dark", dark);
          root.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
