<!doctype html>
<html lang="en-ZA" data-theme="indigo_pink" data-text-size="large">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fbfaf7" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#171613" />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <title>Farmyard Bookings</title>
    <script type="module">
      // Apply the stored appearance before React mounts: the Material 2 tokens
      // for the user's swatch pair, the mode class and the text size. Mirrors
      // src/lib/appearance.ts; tokens.css already holds the Indigo + Pink defaults.
      import { pairFromSlug, slugFromPair, tokensFor } from "/src/styles/m2.mjs";
      try {
        const root = document.documentElement;
        let stored = null;
        try {
          stored = JSON.parse(localStorage.getItem("fy.appearance") || "null");
        } catch (e) {}
        if (!stored || typeof stored !== "object") {
          const legacy = localStorage.getItem("fy.theme");
          stored = { mode: legacy === "light" || legacy === "dark" ? legacy : "system" };
        }
        const pair = pairFromSlug(stored.theme);
        const mode = stored.mode === "light" || stored.mode === "dark" ? stored.mode : "system";
        const size = stored.text_size === "default" || stored.text_size === "xlarge" ? stored.text_size : "large";
        const dark = mode === "dark" || (mode === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        const tokens = tokensFor(pair, dark ? "dark" : "light");
        for (const k in tokens) root.style.setProperty("--" + k, tokens[k]);
        root.setAttribute("data-theme", slugFromPair(pair));
        root.setAttribute("data-text-size", size);
        root.classList.toggle("dark", dark);
        root.style.colorScheme = dark ? "dark" : "light";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
