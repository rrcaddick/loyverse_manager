{% extends "base.html" %}
{% block title %}Shop till{% endblock %}
{% block content %}
<div class="content-header"><div class="container-fluid">
  <div class="d-flex align-items-center justify-content-between flex-wrap">
    <h1 class="m-0">Shop till</h1>
    <div class="d-flex align-items-center">
      <input type="date" id="day" class="form-control form-control-sm mr-2" value="{{ today }}" style="width: 11rem">
      <span id="live" class="badge badge-success">live</span>
    </div>
  </div>
</div></div>
<div class="content"><div class="container-fluid">
  <div class="row">
    <div class="col-md-3 col-sm-6"><div class="small-box bg-info"><div class="inner"><h3 id="k-count">–</h3><p>Sales</p></div><div class="icon"><i class="fas fa-receipt"></i></div></div></div>
    <div class="col-md-3 col-sm-6"><div class="small-box bg-success"><div class="inner"><h3 id="k-total">–</h3><p>Taken</p></div><div class="icon"><i class="fas fa-coins"></i></div></div></div>
    <div class="col-md-6"><div class="card"><div class="card-body py-2"><div id="k-types" class="text-muted">By payment type</div></div></div></div>
  </div>
  <div class="card">
    <div class="card-body table-responsive p-0">
      <table class="table table-hover table-sm mb-0">
        <thead><tr><th>Time</th><th>No.</th><th>Type</th><th>Items</th><th class="text-right">Total</th><th>Paid by</th><th>Card</th><th>Cashier</th></tr></thead>
        <tbody id="rows"><tr><td colspan="8" class="text-muted p-3">Waiting for the first sale…</td></tr></tbody>
      </table>
    </div>
  </div>
</div></div>
{% endblock %}
{% block extra_js %}
<script>
(function () {
  const rows = document.getElementById('rows'), dayInput = document.getElementById('day'), live = document.getElementById('live');
  let latest = 0, failures = 0;
  const rand = n => 'R ' + Number(n).toLocaleString('en-ZA', {minimumFractionDigits: 2, maximumFractionDigits: 2});
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  function render(d) {
    document.getElementById('k-count').textContent = d.count;
    document.getElementById('k-total').textContent = rand(d.total);
    const types = Object.keys(d.by_type).sort();
    document.getElementById('k-types').innerHTML = types.length ? types.map(t => '<span class="mr-3"><strong>' + esc(t) + '</strong> ' + rand(d.by_type[t]) + '</span>').join('') : '<span class="text-muted">By payment type</span>';
    if (!d.rows.length) { rows.innerHTML = '<tr><td colspan="8" class="text-muted p-3">No sales on this day.</td></tr>'; return; }
    rows.innerHTML = d.rows.map(r => {
      const items = r.items.map(i => esc(i.product) + (Number(i.quantity) !== 1 ? ' ×' + Number(i.quantity) : '')).join(', ');
      const card = r.card ? '<span title="' + esc(r.card.trans_no) + '">' + esc(r.card.masked || '') + ' <small class="text-muted">auth ' + esc(r.card.auth_no) + '</small></span>' : '';
      const cls = r.type_code === '200' ? '' : 'text-muted';
      return '<tr class="' + cls + (r.id > latest ? ' table-success' : '') + '"><td>' + esc(r.time) + '</td><td>' + esc(r.number) + '</td><td>' + esc(r.type) + '</td><td>' + items + '</td><td class="text-right">' + rand(r.total) + '</td><td>' + esc(r.payments) + '</td><td>' + card + '</td><td>' + esc(r.user) + '</td></tr>';
    }).join('');
    latest = Math.max(latest, d.latest_id);
  }
  async function refresh() {
    try {
      const resp = await fetch('/shop/till/data?day=' + encodeURIComponent(dayInput.value), {cache: 'no-store'});
      if (!resp.ok) throw new Error(resp.status);
      render(await resp.json()); failures = 0;
      live.className = 'badge badge-success'; live.textContent = 'live';
    } catch (e) {
      failures++; live.className = 'badge badge-danger'; live.textContent = 'not updating';
    }
  }
  dayInput.addEventListener('change', () => { latest = 0; refresh(); });
  refresh(); setInterval(refresh, 10000);
})();
</script>
{% endblock %}
